name: ecommerce-staging

services:
  reverse-proxy:
    image: nginx:1.28-alpine
    depends_on:
      - frontend
      - backend-nginx
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:8080"
      - "${BACKEND_HTTP_PORT:-8081}:8081"
    volumes:
      - ../nginx/reverse-proxy.staging.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_APP_BACKEND_BASE_URL: ${VITE_APP_BACKEND_BASE_URL:-http://localhost:8081}
        VITE_SYMLINK_FOLDER: ${VITE_SYMLINK_FOLDER:-storage}
    image: ecommerce-frontend:staging
    env_file:
      - ../env/staging/frontend.env
    restart: unless-stopped

  backend-nginx:
    image: nginx:1.28-alpine
    depends_on:
      - backend-php
    volumes:
      - ../../backend/public:/var/www/html/public:ro
      - backend_public_storage:/var/www/html/public/storage:ro
      - ../../backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  backend-php:
    build:
      context: ../../backend
      dockerfile: docker/php/Dockerfile
    image: ecommerce-backend:staging
    env_file:
      - ../env/staging/backend.env
    volumes:
      - backend_public_storage:/var/www/html/storage/app/public
      - backend_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - ../env/staging/backend.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  backend_public_storage:
  backend_logs:
