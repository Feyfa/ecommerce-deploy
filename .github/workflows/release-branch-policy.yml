name: Release Branch Policy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate deploy source branch
    runs-on: ubuntu-latest

    steps:
      - name: Validate release branch mapping
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -eu

          if [ "$BASE_BRANCH" != "main" ]; then
            echo "Unsupported deploy target branch: $BASE_BRANCH"
            exit 1
          fi

          case "$HEAD_BRANCH" in
            *-staging|staging|main)
              echo "Invalid deploy source branch: $HEAD_BRANCH"
              exit 1
              ;;
            feature/*|story/*|bug/*|task/*|hotfix/*)
              ;;
            *)
              echo "Invalid deploy source branch: $HEAD_BRANCH"
              exit 1
              ;;
          esac

          echo "Accepted deploy mapping: $HEAD_BRANCH -> $BASE_BRANCH"
