name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build images and deploy staging stack
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90

    steps:
      - name: Verify deploy branch
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run Deploy Staging from deploy/main" >&2
            exit 1
          fi

      - name: Checkout deploy repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout staging frontend
        uses: actions/checkout@v4
        with:
          repository: Feyfa/ecommerce-frontend
          ref: staging
          path: frontend
          persist-credentials: false

      - name: Checkout staging backend
        uses: actions/checkout@v4
        with:
          repository: Feyfa/ecommerce-backend
          ref: staging
          path: backend
          persist-credentials: false

      - name: Record application source commits
        run: |
          echo "FRONTEND_SHA=$(git -C frontend rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BACKEND_SHA=$(git -C backend rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure SSH access
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ecommerce_staging_deploy
          chmod 600 ~/.ssh/ecommerce_staging_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Read staging frontend build configuration
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -eu
          trap 'rm -f "$RUNNER_TEMP/frontend.env"' EXIT
          # --- step 1 - start - copy VM configuration to the ephemeral runner
          scp -i ~/.ssh/ecommerce_staging_deploy -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST:/opt/ecommerce/deploy/env/staging/frontend.env" \
            "$RUNNER_TEMP/frontend.env"
          chmod 600 "$RUNNER_TEMP/frontend.env"
          # --- step 1 - end - copy VM configuration to the ephemeral runner

          # --- step 2 - start - export only validated Vite build values
          python3 scripts/export-frontend-build-env.py "$RUNNER_TEMP/frontend.env" "$GITHUB_ENV"
          # --- step 2 - end - export only validated Vite build values

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR on the runner
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish staging frontend
        id: frontend_image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/docker/nginx/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/feyfa/ecommerce-frontend:staging-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/Feyfa/ecommerce-deploy
            org.opencontainers.image.url=https://github.com/Feyfa/ecommerce-frontend
            org.opencontainers.image.revision=${{ env.FRONTEND_SHA }}
          build-args: |
            VITE_APP_BACKEND_BASE_URL=${{ env.VITE_APP_BACKEND_BASE_URL }}
            VITE_SYMLINK_FOLDER=${{ env.VITE_SYMLINK_FOLDER }}
            VITE_GEOAPIFY_API_KEY=${{ env.VITE_GEOAPIFY_API_KEY }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ env.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_CLERK_SIGN_IN_URL=${{ env.VITE_CLERK_SIGN_IN_URL }}
            VITE_CLERK_SIGN_UP_URL=${{ env.VITE_CLERK_SIGN_UP_URL }}
            VITE_FEATURE_CLERK_PASSKEY=${{ env.VITE_FEATURE_CLERK_PASSKEY }}
            VITE_FEATURE_CLERK_TOTP=${{ env.VITE_FEATURE_CLERK_TOTP }}

      - name: Build and publish staging backend PHP
        id: backend_image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/php/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/feyfa/ecommerce-backend-php:staging-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/Feyfa/ecommerce-deploy
            org.opencontainers.image.url=https://github.com/Feyfa/ecommerce-backend
            org.opencontainers.image.revision=${{ env.BACKEND_SHA }}

      - name: Build and publish staging backend Nginx
        id: backend_nginx_image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/nginx/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/feyfa/ecommerce-backend-nginx:staging-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/Feyfa/ecommerce-deploy
            org.opencontainers.image.url=https://github.com/Feyfa/ecommerce-backend
            org.opencontainers.image.revision=${{ env.BACKEND_SHA }}

      - name: Sync deploy configuration on staging VM
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -eu
          ssh -i ~/.ssh/ecommerce_staging_deploy -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' sh -s" <<'EOF'
          set -eu
          cd /opt/ecommerce/deploy
          # --- step 1 - start - sync the deploy repository without application checkouts
          git checkout main
          git pull --ff-only origin main
          # --- step 1 - end - sync the deploy repository without application checkouts

          # --- step 2 - start - reject a newer deploy revision than this workflow
          if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ]; then
            echo "Deploy main changed after this workflow started; rerun the workflow" >&2
            exit 1
          fi
          # --- step 2 - end - reject a newer deploy revision than this workflow
          EOF

      - name: Pull images and deploy staging
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_IMAGE: ghcr.io/feyfa/ecommerce-frontend@${{ steps.frontend_image.outputs.digest }}
          BACKEND_IMAGE: ghcr.io/feyfa/ecommerce-backend-php@${{ steps.backend_image.outputs.digest }}
          BACKEND_NGINX_IMAGE: ghcr.io/feyfa/ecommerce-backend-nginx@${{ steps.backend_nginx_image.outputs.digest }}
        run: |
          set -eu
          printf '%s\n' "$FRONTEND_IMAGE" | grep -Eq '^ghcr\.io/feyfa/ecommerce-frontend@sha256:[0-9a-f]{64}$'
          printf '%s\n' "$BACKEND_IMAGE" | grep -Eq '^ghcr\.io/feyfa/ecommerce-backend-php@sha256:[0-9a-f]{64}$'
          printf '%s\n' "$BACKEND_NGINX_IMAGE" | grep -Eq '^ghcr\.io/feyfa/ecommerce-backend-nginx@sha256:[0-9a-f]{64}$'
          printf '%s\n' "$GHCR_USER" | grep -Eq '^[A-Za-z0-9-]+$'
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/ecommerce_staging_deploy -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd /opt/ecommerce/deploy && GHCR_USER='$GHCR_USER' ./scripts/deploy-staging.sh '$FRONTEND_IMAGE' '$BACKEND_IMAGE' '$BACKEND_NGINX_IMAGE' '$FRONTEND_SHA' '$BACKEND_SHA'"
