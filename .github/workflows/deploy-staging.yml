name: Deploy Staging

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging stack
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure SSH access
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ecommerce_staging_deploy
          chmod 600 ~/.ssh/ecommerce_staging_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy staging over SSH
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/ecommerce_staging_deploy -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" <<'EOF'
          set -eu

          cd /opt/ecommerce/frontend
          git fetch origin
          git checkout staging || git checkout -b staging origin/staging
          git pull --ff-only origin staging
          git branch --set-upstream-to=origin/staging staging

          cd /opt/ecommerce/backend
          git fetch origin
          git checkout staging || git checkout -b staging origin/staging
          git pull --ff-only origin staging
          git branch --set-upstream-to=origin/staging staging

          cd /opt/ecommerce/deploy
          git pull --ff-only origin main
          ./scripts/deploy-staging.sh

          docker compose --env-file env/staging/backend.env --env-file env/staging/frontend.env -f compose/compose.staging.yml ps

          for url in http://localhost:8080 http://localhost:8081; do
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --max-time 10 "$url" > /dev/null; then
                break
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Health check failed for $url"
                exit 1
              fi

              sleep 3
            done
          done
          EOF
