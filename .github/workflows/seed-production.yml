name: Seed Production

on:
  workflow_dispatch:
    inputs:
      seeder_class:
        description: Seeder class name from backend/database/seeders
        required: true
        type: string

concurrency:
  group: seed-production
  cancel-in-progress: false

jobs:
  seed:
    name: Run production seeder
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      SEEDER_CLASS: ${{ inputs.seeder_class }}

    steps:
      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure SSH access
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ecommerce_production_deploy
          chmod 600 ~/.ssh/ecommerce_production_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run production seeder over SSH
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -eu
          if [[ ! "$SEEDER_CLASS" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "Seeder class must be a simple PHP class name" >&2
            exit 1
          fi
          ssh -i ~/.ssh/ecommerce_production_deploy -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "SEEDER_CLASS='$SEEDER_CLASS' sh -s" <<'EOF'
          set -eu

          cd /opt/ecommerce/deploy

          if ! docker compose \
            --env-file env/production/backend.env \
            --env-file env/production/frontend.env \
            --env-file env/production/images.env \
            -f compose/compose.production.yml \
            exec -T backend-php test -f "/var/www/html/database/seeders/${SEEDER_CLASS}.php"; then
            echo "Seeder class file not found: ${SEEDER_CLASS}"
            exit 1
          fi

          if ! docker compose \
            --env-file env/production/backend.env \
            --env-file env/production/frontend.env \
            --env-file env/production/images.env \
            -f compose/compose.production.yml \
            exec -T backend-php grep -q "class ${SEEDER_CLASS}" "/var/www/html/database/seeders/${SEEDER_CLASS}.php"; then
            echo "Seeder class declaration not found: ${SEEDER_CLASS}"
            exit 1
          fi

          docker compose \
            --env-file env/production/backend.env \
            --env-file env/production/frontend.env \
            --env-file env/production/images.env \
            -f compose/compose.production.yml \
            exec backend-php php artisan db:seed --class="${SEEDER_CLASS}" --force
          EOF
