name: Migrate Staging

on:
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Run staging migrations
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure SSH access
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ecommerce_staging_deploy
          chmod 600 ~/.ssh/ecommerce_staging_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run staging migrations over SSH
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/ecommerce_staging_deploy -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" <<'EOF'
          set -eu

          cd /opt/ecommerce/deploy

          docker compose \
            --env-file env/staging/backend.env \
            --env-file env/staging/frontend.env \
            -f compose/compose.staging.yml \
            exec backend-php php artisan migrate --force
          EOF
